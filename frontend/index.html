<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Tracker Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .fab { position: absolute; right: 16px; bottom: 16px; background: #4CAF50; color: #fff; border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; }
    #form-container { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px; border-top: 1px solid #ccc; display: none; max-height: 60%; overflow-y: auto; }
    #loading { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 10px; border-radius: 4px; display: none; }
    label { display: block; margin-top: 8px; }
    input, textarea, select { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 12px; }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="map"></div>
  <div class="fab" id="fab">+</div>
  <div id="form-container">
    <h3>Новое мероприятие</h3>
    <form id="event-form">
      <label>Название<input type="text" id="title" required /></label>
      <label>Описание<textarea id="description"></textarea></label>
      <label>Дата/время<input type="datetime-local" id="event_date" required /></label>
      <label>Категория<select id="category"></select></label>
      <button type="submit">Создать</button>
      <button type="button" id="close-form">Отмена</button>
    </form>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
